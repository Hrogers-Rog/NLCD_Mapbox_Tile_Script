name: Python Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify CLIs and syntax
        run: |
          python get_tile_4.py --help > /dev/null
          python get_tile_area.py --help > /dev/null
          python -m py_compile get_tile_4.py get_tile_area.py
